version: "3"
tasks:
  default:
    desc: List available development tasks
    cmds: [task --list]
  install:
    desc: Install pinned dependencies (bootstrap with npm ci if Task is not installed)
    cmds: [npm ci]
  orb:setup:
    desc: Prepare the orb, reusing unchanged and validated dependencies
    cmds: [bash -n .agents/setup, .agents/setup]
  dev:
    desc: Start React, the local Worker, and persistent local SQLite through Alchemy
    cmds:
      - task: build
      - task --parallel dev:worker dev:web
  dev:worker:
    desc: Local-only Alchemy Worker and SQLite; these placeholders cannot access Cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
      CLOUDFLARE_API_TOKEN: "local-development-only"
    cmds: [npx alchemy dev]
  dev:web:
    desc: Start the React development server
    # Bundled dev's HMR runtime needs Rolldown 1.2.9; leave production Vite unchanged.
    cmds: [node node_modules/vite-dev/bin/vite.js --experimental-bundle]
  build:
    desc: Build production assets
    cmds: [npm run build]
  branding:generate:
    desc: Regenerate production logo and device assets from the vector masters
    cmds: [node tools/branding.ts]
  plugin:build:
    desc: Build plugin ZIPs and checksums (optional -- --app-id ID --version X.Y.Z --require-web --output directory)
    env:
      TZ: UTC
    cmds: ["node tools/plugin-build.ts {{.CLI_ARGS}}"]
  plugin:release:
    desc: Publish built plugin ZIPs to GitHub (requires release authorization, clean main revision, and a registered app)
    cmds: [node tools/plugin-release.ts]
  plugin:smoke:
    desc: Browser E2E for plugin installation UI (requires local dev and agent-browser; optional -- local URL)
    cmds: ["node tools/plugin-smoke.ts {{.CLI_ARGS}}"]
  benchmark:
    desc: Measure local API, shopping CPU, and production bundle sizes (optional -- report.json)
    cmds:
      - task: build
      - node tests/benchmark.ts {{.CLI_ARGS}}
  check:
    desc: Run type checking, lint, formatting checks, and integration smoke tests
    cmds:
      - task: typecheck
      - task: lint
      - task: format:check
      - task: test
  typecheck:
    desc: Check TypeScript types
    cmds: [npm run check]
  lint:
    desc: Run Oxlint and vendored rules (optional -- paths or flags)
    cmds: ["npm run lint -- {{.CLI_ARGS}}"]
  test:
    desc: Run local integration smoke tests (optional -- test paths or Vitest flags)
    cmds: ["npm test -- {{.CLI_ARGS}}"]
  timers:smoke:
    desc: Browser E2E with a real one-minute expiry (requires agent-browser and running local dev; optional -- local URL)
    cmds: ["node tools/timers-smoke.ts {{.CLI_ARGS}}"]
  groceries:smoke:
    desc: Grocery browser E2E (requires agent-browser and an empty disposable local household; optional -- local URL)
    cmds: ["node tools/groceries-smoke.ts {{.CLI_ARGS}}"]
  matching:eval:
    desc: Real Cloudflare matching evaluation (-- normalization|models|history|preview|preview-ui [report.json] [normalizer-model]; preview requires an empty owning thread Preview)
    cmds: ["node tools/matching-eval.ts {{.CLI_ARGS}}"]
  matching:smoke:
    desc: Suggestion-selection browser E2E (requires empty disposable local household; optional -- local URL)
    cmds: ["node tools/matching-smoke.ts {{.CLI_ARGS}}"]
  format:
    desc: Format source files (optional -- paths or flags)
    cmds: ["npm run format -- {{.CLI_ARGS}}"]
  format:check:
    desc: Check source formatting without writing files
    cmds: [npm run format -- --check]
  audit:
    desc: Audit all dependencies (optional -- npm audit flags)
    cmds: ["npm audit {{.CLI_ARGS}}"]
  audit:production:
    desc: Audit production dependencies only
    cmds: [npm audit --omit=dev]
  cf:
    desc: Run the pinned Cloudflare CLI (optional -- command and flags; cloud writes require authorization)
    env:
      CF_SEND_TELEMETRY: "false"
    cmds: ["npx cf {{.CLI_ARGS}}"]
  preview:
    desc: Manage disposable Cloudflare Previews (-- up, test, list, down, gc, or request; no args for help)
    cmds: ["npm run preview -- {{.CLI_ARGS}}"]
  mcp:smoke:
    desc: Check public production MCP discovery, OAuth denial, and Access consent gate (no credentials or writes)
    cmds: [node tools/mcp-smoke.ts]
  mcp:preview:
    desc: Manage isolated MCP Preview (-- up or down; never production)
    cmds: ["node tools/mcp-preview.ts {{.CLI_ARGS}}"]
  mcp:preview:test:
    desc: Exercise MCP OAuth and recipe writes in the isolated Preview only
    cmds: [node tools/mcp-preview-test.ts]
  mcp:eval:
    desc: Trusted orb eval bootstrap (-- connect, check, or disconnect <Preview /eval/mcp URL>)
    cmds: ["node tools/mcp-eval.ts {{.CLI_ARGS}}"]
  smoke:open:
    desc: Open the production smoke-test browser (deployment owner only; read-only credentials required)
    silent: true
    cmds:
      - >-
        agent-browser --namespace hearth-smoke --session service --cdp 9222 --pin-tab
        --headers "$(jq -c '{"CF-Access-Client-Id":.clientId,"CF-Access-Client-Secret":.clientSecret}' .amp/deploy-state/smoke-credentials.json)"
        open https://hearth.joesaia.trade
  cloud:check:
    desc: Validate Cloudflare credential configuration without provisioning resources
    env:
      CI: "true"
    cmds: [npx alchemy provider check-env --provider Cloudflare --no-input]
  cloud:bootstrap:
    desc: Provision shared Alchemy state infrastructure (requires explicit approval)
    env:
      CI: "true"
    cmds: [npx alchemy provider cloudflare bootstrap]
  plan:
    desc: Preview production changes; bootstrap remote state separately first
    env:
      CI: "true"
    cmds:
      - task: build
      - npx alchemy plan --stage production
  deploy:
    desc: Deploy Worker, assets, and D1 migrations (requires explicit approval; optional -- --yes)
    env:
      CI: "true"
    cmds:
      - task: build
      - npx alchemy deploy --stage production {{.CLI_ARGS}}
