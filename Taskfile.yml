version: "3"
tasks:
  install:
    desc: Install the pinned toolchain
    cmds: [npm ci]
  dev:
    desc: Start React, the local Worker, and persistent local SQLite through Alchemy
    cmds: [npx vite build, npx task --parallel dev:worker dev:web]
  dev:worker:
    desc: Local-only Alchemy Worker and SQLite; these placeholders cannot access Cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
      CLOUDFLARE_API_TOKEN: "local-development-only"
    cmds: [npx alchemy dev]
  dev:web:
    cmds: [npx vite]
  build:
    cmds: [npx vite build]
  check:
    cmds: [npx tsc --noEmit, npx oxlint, npx oxfmt --check, npx vitest run]
  format:
    cmds: [npx oxfmt]
  cloud:check:
    desc: Validate Cloudflare credential configuration without provisioning resources
    env:
      CI: "true"
    cmds: [npx alchemy provider check-env --provider Cloudflare --no-input]
  cloud:bootstrap:
    desc: Provision shared Alchemy state infrastructure (requires explicit approval)
    env:
      CI: "true"
    cmds: [npx alchemy provider cloudflare bootstrap]
  plan:
    desc: Preview production changes; bootstrap remote state separately first
    env:
      CI: "true"
    cmds: [npx vite build, npx alchemy plan --stage production]
  deploy:
    desc: Deploy Worker, assets, and D1 migrations (requires Cloudflare credentials)
    env:
      CI: "true"
    cmds: [npx vite build, npx alchemy deploy --stage production]
