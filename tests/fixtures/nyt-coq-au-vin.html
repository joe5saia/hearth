    "description": "A coq au vin is a classic French stew in which chicken is braised slowly in red wine and a little brandy to yield a supremely rich sauce filled with tender meat, crisp bits of bacon, mushrooms and burnished pearl onions. Traditional recipes call for a whole cut-up chicken, but using all dark meat gives you a particularly succulent dish without the risk of overcooked white meat. However, if you would rather substitute a whole cut-up bird, just add the breasts in the last 30 minutes of simmering. If you want to skip the croutons for garnish you can, but they do add a lovely, buttery crunch alongside the soft, simmered meat and vegetables. This recipe is part of The New Essentials of French Cooking, a guide to definitive dishes every modern cook should master.",
